; The gateway is hand-edited in staging.
root_name = gateway
workers = 4
debug = false

[service]
name = gateway
workers = 4
debug = false

[http]
host = 127.0.0.1
port = 8080

[http.timeouts]
read_ms = 5000
write_ms = 2500

[database]
url = postgres://app@db.internal/app

[database.pool]
min = 2
max = 20

[logging]
level = info
targets = stdout, file
