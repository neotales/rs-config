[package]
name = "neotales-config-keepass"
description = "Opt-in KeePass KDBX configuration source: explicit entry fields mapped to explicit paths"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/neotales/rs-config"
authors = ["x0craft"]
readme = "README.md"
keywords = ["config", "configuration", "keepass", "kdbx", "secrets"]
categories = ["config"]

[features]
# The provider itself has no optional behavior. `reload` only forwards the
# core crate's reload feature so a caller can name this crate's feature and get
# the whole path (`Builder::build_reloadable`, `Reload`, `Watcher`).
default = []
reload = ["neotales-config/reload"]

[dependencies]
# The version is required as well as the path: the path makes the local
# workspace resolve this checkout, and the version is what a published package
# records. Both crates are released together at the group version.
neotales-config = { version = "0.0.0-alpha.0", path = "../config", default-features = false }
# Published from rs-keepass. The local checkout was released as this version;
# the public API used here is `KdbxFile`, `KdbxCredentials`, `KdbxReadLimits`,
# `KdbxUuid`, and the document model.
neotales-keepass = "0.0.0-alpha.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
