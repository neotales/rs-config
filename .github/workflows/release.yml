name: release

# This workflow verifies a release tag. It does not publish.
#
# Publishing was automated until it was found to make a promise it could not
# keep. `cargo publish` does not upload `target/package/<name>-<version>.crate`;
# it repackages the checkout and uploads that repackaging. A preceding
# `cargo publish --dry-run` proves only that the packaging was byte-identical at
# that moment, not that the second packaging, the one whose bytes are sent, is.
# Driving the crates.io upload API from here instead would put the registry
# token inside this automation and would still be unprovable without a real
# publish: the Cargo documentation of the endpoint says the crates.io rules it
# lists are not exhaustive. Both options spend an immutable version if they are
# wrong, so the workflow no longer publishes at all.
#
# What remains is the proof that is real: the group packages together, in
# dependency order, against a staged registry built from the committed
# `Cargo.lock`; each member's verified artifact is recorded once by SHA-256; and
# crates.io is asked, read-only, whether it already holds those exact bytes. The
# recorded digest is what a human compares with the artifact downloaded after a
# manual publish. See RELEASE.md, section "Publishing by hand".
#
# This repository is a virtual workspace: the crates live in top-level
# directories, `config/` is `neotales-config`, and `keepass/` is
# `neotales-config-keepass` at the same version.
#
# The tag must equal `v` plus the version in every crate manifest, so the tree
# this workflow verified is a thing that can be named.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Runs on both triggers. This is the whole release for a manual run: checks,
  # a `cargo publish --dry-run`, and the packaging gate. Nothing publishes.
  check:
    name: pre-publish checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --all-features

      - name: Test without default features
        run: cargo test --workspace --all-targets --no-default-features

      # This exercises the publish path's packaging and verification build. It
      # is a packaging smoke test only: it does not prove that a later real
      # `cargo publish` would send the same bytes, and nothing in this workflow
      # relies on it for that.
      - name: Package the publish path without publishing
        run: cargo publish -p neotales-config --dry-run --locked

      # A tag run repeats this gate in the verify job, immediately before the
      # digest is recorded, so it is not run twice here. A manual run never
      # reaches that job; this is the pre-flight that tells you the tree
      # packages and the version can be released before you tag it.
      - name: Verify the provider packages against the candidate core
        if: github.event_name == 'workflow_dispatch'
        run: python3 eng/release/stage_gate.py gate

      - name: Report the registry state and the manual plan
        if: github.event_name == 'workflow_dispatch'
        run: python3 eng/release/stage_gate.py preflight --artifact-dir target/package

  version:
    name: tag matches the crate version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the tag with the crate manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          import tomllib

          # One entry per published member. A new crate is added here with its
          # own directory in the same commit that adds it to the workspace.
          manifests = {
              "neotales-config": "config/Cargo.toml",
              "neotales-config-keepass": "keepass/Cargo.toml",
          }

          versions = {}
          for name, path in manifests.items():
              with open(path, "rb") as handle:
                  package = tomllib.load(handle).get("package")
              if not isinstance(package, dict):
                  sys.exit(f"{path} has no [package] table")
              version = package.get("version")
              if not isinstance(version, str):
                  sys.exit(
                      f"{path} [package] version is not a literal string. "
                      "Each crate must carry the published version."
                  )
              versions[name] = version

          tag = os.environ["TAG"]
          print(f"tag: {tag}")
          for name, version in versions.items():
              print(f"{name}: {version}")

          distinct = set(versions.values())
          if len(distinct) != 1:
              print(f"::error::the crates carry different versions: {versions}")
              sys.exit(1)

          expected = f"v{distinct.pop()}"
          if tag != expected:
              print(f"::error::tag {tag} does not match {expected}")
              sys.exit(1)
          PY

  verify:
    name: verify the tag (publishing is disabled)
    # A push of a `v*` tag, and nothing else. A manual run must stay a
    # verification of the tree it was started from, at whatever ref that is.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [check, version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read-only, and no `id-token`: this job holds no credential of any kind
    # and has no step that could publish.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-verify

      # The gate packages and verifies the group against a staged registry
      # built from Cargo.lock. It reproduces the artifacts a release would
      # publish and proves the provider resolves against the candidate core.
      - name: Verify the group packages as a group
        run: python3 eng/release/stage_gate.py gate

      # Records each artifact's SHA-256 once, compares those captured digests
      # with crates.io (read-only), fails on a version published at different
      # bytes, a matching-but-yanked version, or an inconsistent group, and
      # prints the manual plan for a member that is not published yet.
      - name: Record the verified digests and the manual plan
        env:
          PLAN: ${{ runner.temp }}/preflight.txt
        run: |
          set -euo pipefail
          python3 eng/release/stage_gate.py preflight \
            --artifact-dir target/package | tee "$PLAN"

      # The digests above are only meaningful for this exact tag, from an
      # unmodified tree. The gate writes only to the ignored target directory,
      # and the capture check inside preflight already refuses an artifact that
      # changed after it was read.
      - name: Prove the checkout is the tag, unmodified
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          described=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          if [ "$described" != "$TAG" ]; then
            echo "::error::HEAD is ${described:-<no exact tag>}, not ${TAG}"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=normal)" ]; then
            echo "::error::the checkout has changes; the recorded digests did not come from this tag alone"
            git status --short
            exit 1
          fi

      # A deliberate warning, not a silent success: the tag is verified, not
      # released. The summary is what a human copies into the next step.
      - name: State that nothing was published
        env:
          PLAN: ${{ runner.temp }}/preflight.txt
        run: |
          set -euo pipefail
          {
            echo "## Nothing was published"
            echo
            echo "Automated publishing is disabled. crates.io cannot be proven to"
            echo "have received the bytes this run verified, so the upload is a"
            echo "manual step. Verify the work above, then follow RELEASE.md"
            echo "section \"Publishing by hand\"."
            echo
            echo "Recorded artifacts and registry state:"
            echo
            echo '```text'
            cat "$PLAN"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Publishing is manual::Nothing was published. Follow RELEASE.md section 'Publishing by hand'."
