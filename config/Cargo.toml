[package]
name = "neotales-config"
description = "Process-local configuration: ordered sources merged into one immutable, typed snapshot"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/neotales/rs-config"
authors = ["x0craft"]
readme = "README.md"
keywords = ["config", "configuration", "settings", "precedence", "merge"]
categories = ["config"]
# Benchmarks and the fixtures they generate are development tooling, not part
# of the published crate. Excluding the directory removes the benchmark sources
# from the `.crate`; Cargo drops the `[[bench]]` target whose source is missing.
exclude = ["/benches"]

[features]
# The core stays memory-only. Every provider is opt-in, so a build that reads
# only in-memory values compiles no provider and no optional dependency.
# `args`, `environment`, and `ini` add code, not a crate.
default = []
args = []
environment = []
dotenv = ["dep:neotales-dotenv", "dep:neotales-env"]
json = ["dep:serde_json"]
json5 = ["dep:json5"]
jsonc = ["dep:jsonc-parser"]
toml = ["dep:toml"]
yaml = ["dep:saphyr", "dep:saphyr-parser"]
ini = []
# `reload` adds the cloneable snapshot holder, manual refresh, change subscriptions, and an
# explicit polling watcher. It uses only `std`: no parser, no async runtime, and no thread until
# `Reload::start_watching` is called.
reload = []

[dependencies]
serde = { version = "1.0", default-features = false, features = ["std"] }
neotales-dotenv = { version = "0.0.0-alpha.1", optional = true }
neotales-env = { version = "0.0.0-alpha.1", optional = true }
serde_json = { version = "1.0", optional = true }
json5 = { version = "1.3", optional = true }
jsonc-parser = { version = "0.34", default-features = false, optional = true }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"], optional = true }
saphyr = { version = "0.0.12", default-features = false, optional = true }
saphyr-parser = { version = "0.0.12", default-features = false, optional = true }

[dev-dependencies]
# The benchmark harness. Default features are off so the dev tree does not pull
# in the plotting stack or rayon; the suite prints its statistics and needs no
# gnuplot.
criterion = { version = "0.8", default-features = false }
serde = { version = "1.0", features = ["derive"] }
# A generic value target for the parser-only JSON/JSON5 baselines. This is a
# dev-dependency only: the library's own `json` feature still owns `serde_json`
# as an optional runtime dependency.
serde_json = "1.0"
tempfile = "3"

[[bench]]
name = "sources"
harness = false

[[example]]
name = "reload"
required-features = ["reload", "toml"]

[lints]
workspace = true
