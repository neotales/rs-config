[workspace]
# A virtual manifest: the repository root is a workspace, not a package.
# `config/` is `neotales-config`; a crate that versions with it gets its own
# top-level directory rather than a place under `crates/`.
#
# Every member is a virtual workspace member, so Cargo's default members are
# all of them: a bare `cargo test` at the root reaches every crate.
resolver = "3"
members = ["config", "keepass"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
