name: ci

# One repository, a virtual workspace. `config/` is `neotales-config`; a crate
# that versions with it gets its own top-level directory. There is no root
# package, so every gate names the workspace rather than relying on whatever
# Cargo's default members happen to be.

on:
  push:
    # Every branch, not only the default one: a branch filter hides a failure
    # until the work lands. No path filter either, because a change to a README
    # can still be the change that breaks the build.
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --all-features

      # The core has no default feature, and the vault provider's `reload`
      # feature is opt-in. This leg builds and tests exactly that graph, so a
      # provider cannot quietly become part of the default build.
      - name: Test without default features
        run: cargo test --workspace --all-targets --no-default-features

      - name: Documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

  core-graph:
    name: core has no vault dependency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: core-graph

      # `neotales-config` is the core. It must not compile a KeePass codec or
      # any cryptography for a caller that never registers the vault provider.
      - name: The default core build has no KeePass code
        run: |
          set -euo pipefail
          cargo tree -p neotales-config --no-default-features --edges normal | tee graph.txt
          if grep -qi 'keepass' graph.txt; then
            echo "::error::neotales-config depends on a KeePass crate in its default build"
            exit 1
          fi

  release-gate:
    name: release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-gate

      # The release workflow runs this same script to verify a tag. Here it runs
      # with the failure injection: a gate that has never been seen rejecting
      # anything is not a gate. The injection stages the registry without the
      # core and with a drifted core version, rejects a provider or core
      # published at different bytes or matching-but-yanked with zero pending
      # publishes, proves both packages are byte-stable, refuses a package
      # stamped dirty even after the tree is clean, writes the gate record,
      # hands off its digest, then mutates a copy of the artifact, removes one,
      # edits a manifest, moves the commit, changes a source file, and rewrites
      # the record and an artifact together between gate and preflight and
      # requires each to be refused before a plan; proves the program has no
      # publishing path or token read; and runs the gate from outside the
      # repository root. Nothing is published.
      - name: Package the group against a staged registry
        run: python3 eng/release/stage_gate.py gate --self-test

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs 1.100.0, the channel in rust-toolchain.toml and the minimum
      # supported version declared in every crate manifest. Do not float to
      # stable here: a job named msrv that tests stable proves nothing.
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: msrv

      # Every workspace member must declare the same minimum, not just the
      # first package cargo happens to list.
      - name: Check the declared minimum Rust version
        run: |
          cargo metadata --no-deps --format-version 1 > metadata.json
          python3 - <<'PY'
          import json
          import sys

          with open("metadata.json", encoding="utf-8") as handle:
              packages = json.load(handle)["packages"]

          if not packages:
              sys.exit("cargo metadata listed no packages")

          failed = False
          for package in packages:
              declared = package.get("rust_version") or ""
              print(f"{package['name']}: rust-version {declared or '<unset>'}")
              if declared != "1.100":
                  print(
                      f"::error::{package['name']} must declare "
                      f'rust-version = "1.100", found {declared or "<unset>"}.'
                  )
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Test on the minimum supported Rust version
        run: cargo test --workspace --all-targets --all-features
