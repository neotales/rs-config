[package]
name = "neotales-config"
description = "Process-local configuration: ordered sources merged into one immutable, typed snapshot"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/neotales/rs-config"
authors = ["x0craft"]
readme = "README.md"
keywords = ["config", "configuration", "settings", "precedence", "merge"]
categories = ["config"]

[features]
# The core stays memory-only. Every provider is opt-in, so a build that reads
# only in-memory values compiles no provider and no optional dependency.
# `dotenv` is the only provider that needs a dependency; `args` and
# `environment` add code, not a crate.
default = []
args = []
environment = []
dotenv = ["dep:neotales-dotenv"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["std"] }
neotales-dotenv = { version = "0.0.0-alpha.1", optional = true }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }

[lints]
workspace = true
