name: release

# Publishing is driven by a tag, never by a branch. The tag must equal `v` plus
# the version in every crate manifest, so the thing that ran is a thing that can
# be named. This repository is a virtual workspace: the crates live in
# top-level directories, `config/` is `neotales-config`, and `keepass/` is
# `neotales-config-keepass`.
#
# The group is published in dependency order, and it is verified in that order
# before anything is uploaded: `eng/release/stage_gate.py` stages the exact
# `.crate` files a release would upload in a local Cargo registry and packages
# every member against it. Without that gate the core uploads first and the
# provider's inability to resolve the unpublished core is discovered afterwards,
# when the core version can no longer be changed.
#
# Trusted publishing: the publish job asks crates.io for a short-lived token
# over OIDC. There is no CARGO_REGISTRY_TOKEN secret in this repository.
# crates.io cannot bootstrap a crate this way. The first publish of a new crate
# is manual, through ~/work/rs/publish.sh. See RELEASE.md.
#
# The publish job sets no GitHub environment on purpose. The trusted publisher
# saved on crates.io for this organisation has an empty environment, and
# crates.io compares that field with the job's, so an environment on either side
# alone fails the token exchange.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Runs on both triggers. On workflow_dispatch this job is the whole release:
  # checks, a `cargo publish -p neotales-config --dry-run`, and the packaging
  # gate, never a real publish.
  check:
    name: pre-publish checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --all-features

      - name: Test without default features
        run: cargo test --workspace --all-targets --no-default-features

      - name: Package without publishing
        run: cargo publish -p neotales-config --dry-run --locked

      # A tag run repeats this gate in the publish job, immediately before the
      # upload it guards, so it is not run twice here. A manual run never
      # reaches that job, and this is the pre-flight that tells you the tree
      # packages before you tag it.
      - name: Verify the provider packages against the candidate core
        if: github.event_name == 'workflow_dispatch'
        run: python3 eng/release/stage_gate.py gate

  version:
    name: tag matches the crate version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the tag with the crate manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          import tomllib

          # One entry per published member. A new crate is added here with its
          # own directory in the same commit that adds it to the workspace.
          manifests = {
              "neotales-config": "config/Cargo.toml",
              "neotales-config-keepass": "keepass/Cargo.toml",
          }

          versions = {}
          for name, path in manifests.items():
              with open(path, "rb") as handle:
                  package = tomllib.load(handle).get("package")
              if not isinstance(package, dict):
                  sys.exit(f"{path} has no [package] table")
              version = package.get("version")
              if not isinstance(version, str):
                  sys.exit(
                      f"{path} [package] version is not a literal string. "
                      "Each crate must carry the published version."
                  )
              versions[name] = version

          tag = os.environ["TAG"]
          print(f"tag: {tag}")
          for name, version in versions.items():
              print(f"{name}: {version}")

          distinct = set(versions.values())
          if len(distinct) != 1:
              print(f"::error::the crates carry different versions: {versions}")
              sys.exit(1)

          expected = f"v{distinct.pop()}"
          if tag != expected:
              print(f"::error::tag {tag} does not match {expected}")
              sys.exit(1)
          PY

  publish:
    name: publish to crates.io
    # A push of a `v*` tag, and nothing else. `workflow_dispatch` can be started
    # at a tag ref, which would otherwise satisfy the ref test alone; a manual
    # run must never publish. Recovery from a failed publish is a re-run of this
    # job from the same tag, which keeps this event. See RELEASE.md.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [check, version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No GitHub environment, deliberately. The trusted publisher stored on
    # crates.io for this organisation has an empty environment, and crates.io
    # compares that field with the job's. Setting `environment: release` here
    # makes the OIDC token exchange fail with no other symptom. If someone ever
    # does set an environment name on crates.io, this job must set that exact
    # name. See RELEASE.md.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-publish

      # Before the token exchange, on purpose: a group that cannot be published
      # together must fail while the job holds no credential. This is also what
      # produces the two .crate files the checksum decisions below compare.
      - name: Verify the group packages as a group
        run: python3 eng/release/stage_gate.py gate

      # Fails when the crate does not exist on crates.io yet, or when the
      # trusted publisher does not match this repository, this workflow file and
      # an empty environment. That is the intended failure: there is nothing to
      # fall back to, and no token to widen. See RELEASE.md for the first
      # publish.
      - name: Exchange the OIDC token for a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # A crates.io version is immutable, and this job can be re-run after the
      # core uploaded and the provider did not. Publishing the core again would
      # fail the job before the provider is reached, so the decision is a
      # checksum comparison between the artifact this run built and the one the
      # registry holds: identical bytes are already published and are skipped,
      # different bytes mean the version was spent by something else and the
      # release must not be retried at it. Never turn this into an
      # ignore-the-error switch.
      - name: Publish the core unless crates.io holds this exact artifact
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          state=$(python3 eng/release/stage_gate.py state \
            --manifest config/Cargo.toml \
            --artifact-dir target/package)
          case "$state" in
            absent)
              cargo publish -p neotales-config --locked
              ;;
            identical)
              echo "::notice title=core already published::crates.io holds the exact neotales-config artifact this run built, so it is not uploaded again. This is how a re-run resumes after the provider failed."
              ;;
            different)
              echo "::error title=core version already spent::crates.io holds this version of neotales-config at different bytes. A crates.io version cannot be replaced: bump the version in every member manifest and release a new tag."
              exit 1
              ;;
            *)
              echo "::error title=unexpected registry state::$state"
              exit 1
              ;;
          esac

      # The provider depends on `neotales-config` at the group version, so the
      # core must be on crates.io before this verification can resolve. The
      # order is the dependency order, and the gate above has already proven
      # that this version of the provider verifies against this version of the
      # core, so a failure here is a registry problem and not a packaging one.
      - name: Publish the vault provider unless crates.io holds this exact artifact
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          state=$(python3 eng/release/stage_gate.py state \
            --manifest keepass/Cargo.toml \
            --artifact-dir target/package)
          case "$state" in
            absent)
              cargo publish -p neotales-config-keepass --locked
              ;;
            identical)
              echo "::notice title=provider already published::crates.io holds the exact neotales-config-keepass artifact this run built. The group at this version is complete."
              ;;
            different)
              echo "::error title=provider version already spent::crates.io holds this version of neotales-config-keepass at different bytes. A crates.io version cannot be replaced: bump the version in every member manifest and release a new tag."
              exit 1
              ;;
            *)
              echo "::error title=unexpected registry state::$state"
              exit 1
              ;;
          esac
